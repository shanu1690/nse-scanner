scanner:
  momentum:
    min_score: 55.0
    top_n: 20
    # style: "momentum" (buy strength) or "fade" (contrarian long of washed-out
    # names). The 3-month factor study found fade beats both baseline and
    # momentum; momentum is kept for comparison. Override per-run with --fade.
    style: "fade"
  options:
    # pre-screen by these single-call NSE endpoints to limit per-symbol chains
    use_oi_prescreen: true
    top_n: 12

data:
  lookback_days: 560
  index_benchmark: "^NSEI"
  # Price + options data source: "smartapi" (Angel One free API, requires a
  # `smartapi:` block in secrets.yaml) or "nse" (yfinance prices + NSE public
  # API). Falls back to nse automatically when SmartAPI is unavailable.
  provider: "smartapi"
