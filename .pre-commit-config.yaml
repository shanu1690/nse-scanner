# Install once:  pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: block-secrets-files
        name: Block secrets files from being committed
        entry: bash -c 'for f in "$@"; do case "$f" in secrets.yaml|secrets.yml|.env|credentials.json) echo "Refusing to commit $f"; exit 1;; esac; done' --
        language: system
        stages: [pre-commit]
