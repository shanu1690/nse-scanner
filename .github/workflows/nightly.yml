name: nightly

# Runs the scanner after market close (Mon-Fri), emits the data bundle,
# builds the React dashboard and deploys everything to GitHub Pages.
#
# Requires repo secrets (Settings -> Secrets and variables -> Actions):
#   SMARTAPI_API_KEY       Angel One API key (developer console)
#   SMARTAPI_CLIENT_ID     Angel One client/trading ID
#   SMARTAPI_PIN           Angel One 4-digit trading PIN
#   SMARTAPI_TOTP_SECRET   base32 TOTP secret from the Angel One app
#   NTFY_TOPIC             optional -- ntfy.sh topic for a push notification
#                          on failure, in addition to the GitHub issue this
#                          workflow always files (see the "Alert on failure"
#                          step). Unset is fine; that step just no-ops.
# and the Pages source set to "GitHub Actions" (Settings -> Pages).
#
# Phase 10 hardening: RUNBOOK.md has the full "job failed, what do I do"
# playbook this workflow's alerting points at.

on:
  schedule:
    # 13:00 UTC = 18:30 IST, weekdays, after the market closes
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanner
        run: pip install -e .

      - name: Connectivity check (SmartAPI endpoints)
        run: |
          echo "== apiconnect (login) =="
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 30 https://apiconnect.angelbroking.com/rest/secure/angelbroking/UserService/GetUserProfile || echo "UNREACHABLE"
          echo "== scrip master (primary) =="
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json || echo "UNREACHABLE"
          echo "== scrip master (fallback) =="
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json || echo "UNREACHABLE"

      - name: Build scanner data (live SmartAPI)
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_ID: ${{ secrets.SMARTAPI_CLIENT_ID }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
        # Runner is fresh each night: --refresh downloads all prices + the
        # NIFTY benchmark, then option chains run within the 600s budget.
        run: nse-scan site --out site --refresh --max-seconds 600

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      # Phase 10: an independent check of the ACTUAL FILES about to go
      # live -- distinct from (and run after) the in-process DataValidator
      # gate `nse-scan site` already applied to the pre-write DataFrame.
      # Same "defence in depth" principle as the options-budget re-check
      # and the per-file credential scan; see nse/quality/bundle_check.py.
      - name: Verify bundle before deploy
        run: nse-scan verify-bundle site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Runs only when an earlier step in this job failed (any of: the
      # connectivity check, the scan itself, the frontend build, the bundle
      # verification, or the deploy). Files (or comments on) one issue
      # rather than a new one per failed night, so repeated failures don't
      # spam the tracker -- RUNBOOK.md has the response playbook this issue
      # links to.
      - name: Alert on failure (GitHub issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'nightly-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Nightly scan/deploy failed',
                labels: [label],
                body: [
                  `The nightly scan/deploy job failed.`,
                  ``,
                  `Run: ${runUrl}`,
                  ``,
                  `See RUNBOOK.md's "Nightly job failed" section for the response`,
                  `playbook. This issue is reused across consecutive failures`,
                  `(deduplicated by the "${label}" label) rather than filed fresh`,
                  `every night -- close it once the underlying cause is fixed.`,
                ].join('\n'),
              });
            }

      # Best-effort second channel -- reuses the same send_ntfy() the daily
      # report already uses (nse/report.py), so this needs no new secret
      # beyond the optional NTFY_TOPIC documented at the top of this file.
      # Silently no-ops (never fails the job) when that secret isn't set.
      - name: Alert on failure (ntfy push, optional)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -c "
          import os
          from nse.report import send_ntfy
          topic = os.environ.get('NTFY_TOPIC', '')
          if not topic:
              print('NTFY_TOPIC not configured -- skipping push, GitHub issue is the record of this failure')
          else:
              run_url = f\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              send_ntfy('nse-scanner nightly FAILED', f'See the run: {run_url}', {'topic': topic})
          " || echo "ntfy push failed -- non-fatal, the GitHub issue above is the primary alert"
