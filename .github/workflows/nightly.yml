name: nightly

# Runs the scanner after market close (Mon-Fri), emits the data bundle,
# builds the React dashboard and deploys everything to GitHub Pages.
#
# Requires repo secrets (Settings -> Secrets and variables -> Actions):
#   SMARTAPI_API_KEY       Angel One API key (developer console)
#   SMARTAPI_CLIENT_ID     Angel One client/trading ID
#   SMARTAPI_PIN           Angel One 4-digit trading PIN
#   SMARTAPI_TOTP_SECRET   base32 TOTP secret from the Angel One app
# and the Pages source set to "GitHub Actions" (Settings -> Pages).

on:
  schedule:
    # 13:00 UTC = 18:30 IST, weekdays, after the market closes
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanner
        run: pip install -e .

      - name: Build scanner data (live SmartAPI)
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_ID: ${{ secrets.SMARTAPI_CLIENT_ID }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
        # Runner is fresh each night: --refresh downloads all prices + the
        # NIFTY benchmark, then option chains run within the 600s budget.
        run: nse-scan site --out site --refresh --max-seconds 600

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
