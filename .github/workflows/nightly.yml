name: nightly

# Runs the scanner after market close (Mon-Fri), builds a risk-gated data
# bundle, and emails the day's picks. No public deploy step: the repo is
# private and staying that way, so this does NOT push to GitHub Pages
# (that needs either a public repo or a paid plan -- see RUNBOOK.md for
# the history of why this changed from an earlier Pages-deploy version).
#
# Requires repo secrets (Settings -> Secrets and variables -> Actions):
#   SMARTAPI_API_KEY       Angel One API key (developer console)
#   SMARTAPI_CLIENT_ID     Angel One client/trading ID
#   SMARTAPI_PIN           Angel One 4-digit trading PIN
#   SMARTAPI_TOTP_SECRET   base32 TOTP secret from the Angel One app
#   EMAIL_FROM             Gmail address the daily report is sent from
#   EMAIL_TO               address the daily report is sent to
#   EMAIL_APP_PASSWORD     Gmail App Password (NOT your real password --
#                          Google Account -> Security -> App passwords)
#   NTFY_TOPIC             optional -- ntfy.sh topic for a push notification
#                          on FAILURE only, in addition to the GitHub issue
#                          this workflow always files (see "Alert on
#                          failure" below), AND used by intraday.yml's
#                          live monitoring during market hours. Unset is
#                          fine; failure-alert step no-ops, but intraday
#                          monitoring then has nowhere to push to.
#
# Phase 10 hardening: RUNBOOK.md has the full "job failed, what do I do"
# playbook this workflow's alerting points at.
#
# Also commits a small candidate bundle (data/latest_bundle/*.json) back
# to the repo -- NOT the full site/ directory, just the few KB
# delivery.json/options.json/manifest.json intraday.yml's live monitoring
# reads during the day (approved picks + capacity-only-vetoed candidates,
# for re-admission if a slot frees up -- see nse/intraday.py).

on:
  schedule:
    # 13:00 UTC = 18:30 IST, weekdays, after the market closes
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanner
        run: pip install -e .

      - name: Connectivity check (SmartAPI endpoints)
        run: |
          echo "== apiconnect (login) =="
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 30 https://apiconnect.angelbroking.com/rest/secure/angelbroking/UserService/GetUserProfile || echo "UNREACHABLE"
          echo "== scrip master (primary) =="
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json || echo "UNREACHABLE"
          echo "== scrip master (fallback) =="
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json || echo "UNREACHABLE"

      - name: Build scanner data (live SmartAPI)
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_ID: ${{ secrets.SMARTAPI_CLIENT_ID }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
        # Runner is fresh each night: --refresh downloads all prices + the
        # NIFTY benchmark, then option chains run within the 600s budget.
        # This still runs the full Phase 7/8 pipeline (options budget cap,
        # risk gate) and writes site/data/*.json -- that bundle is what the
        # report step below reads from, not a separate/duplicate pipeline.
        run: nse-scan site --out site --refresh --max-seconds 600

      # Phase 10: an independent check of the ACTUAL FILES the report is
      # about to be built from -- distinct from (and run after) the
      # in-process DataValidator gate `nse-scan site` already applied to
      # the pre-write DataFrame. Same "defence in depth" principle as the
      # options-budget re-check and the per-file credential scan; see
      # nse/quality/bundle_check.py. A credential_scan FAIL here stops the
      # job before anything gets emailed.
      - name: Verify bundle
        run: nse-scan verify-bundle site

      # Small, tracked candidate bundle for intraday.yml's live monitoring
      # during market hours -- see nse/intraday.py's module docstring.
      # Deliberately NOT the full site/ directory (still gitignored):
      # just the few KB these three files come to. A no-op commit (content
      # genuinely unchanged) is skipped rather than creating an empty commit.
      - name: Commit today's candidate bundle
        run: |
          mkdir -p data/latest_bundle
          cp site/data/delivery.json site/data/options.json site/data/manifest.json data/latest_bundle/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_bundle
          git diff --cached --quiet && echo "No change to the candidate bundle" || \
            git commit -m "Update today's candidate bundle for intraday monitoring [skip ci]"
          git push

      # Reads the ALREADY RISK-GATED site/data bundle (does NOT regenerate
      # picks itself -- see nse/report.py's build_report_from_bundle
      # docstring for why that distinction matters: the other pick-
      # generation path skips Phase 7/8's budget cap and risk gate
      # entirely). Journals today's picks for the running scorecard.
      - name: Send daily report (email)
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: nse-scan report --from-bundle site/data --email

      # Keeps the raw data bundle inspectable from the Actions run (the
      # closest thing to "browse the site" now that nothing is deployed) --
      # useful for debugging what the email was built from on a given night.
      - name: Upload data bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: site/data
          retention-days: 14

      # Runs only when an earlier step in this job failed (any of: the
      # connectivity check, the scan itself, the bundle verification, or
      # sending the report). Files (or comments on) one issue rather than a
      # new one per failed night, so repeated failures don't spam the
      # tracker -- RUNBOOK.md has the response playbook this issue links to.
      - name: Alert on failure (GitHub issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'nightly-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Nightly scan/report failed',
                labels: [label],
                body: [
                  `The nightly scan/report job failed.`,
                  ``,
                  `Run: ${runUrl}`,
                  ``,
                  `See RUNBOOK.md's "Nightly job failed" section for the response`,
                  `playbook. This issue is reused across consecutive failures`,
                  `(deduplicated by the "${label}" label) rather than filed fresh`,
                  `every night -- close it once the underlying cause is fixed.`,
                ].join('\n'),
              });
            }

      # Best-effort second channel -- reuses the same send_ntfy() the daily
      # report already uses (nse/report.py), so this needs no new secret
      # beyond the optional NTFY_TOPIC documented at the top of this file.
      # Silently no-ops (never fails the job) when that secret isn't set.
      - name: Alert on failure (ntfy push, optional)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -c "
          import os
          from nse.report import send_ntfy
          topic = os.environ.get('NTFY_TOPIC', '')
          if not topic:
              print('NTFY_TOPIC not configured -- skipping push, GitHub issue is the record of this failure')
          else:
              run_url = f\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              send_ntfy('nse-scanner nightly FAILED', f'See the run: {run_url}', {'topic': topic})
          " || echo "ntfy push failed -- non-fatal, the GitHub issue above is the primary alert"
