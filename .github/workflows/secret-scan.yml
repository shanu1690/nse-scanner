name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * 1'   # weekly full-history sweep, Mondays 07:30 IST

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history — a secret in an old commit is still a secret

      - name: Scan repository history
        uses: trufflesecurity/trufflehog@main
        with:
          # The action already passes --fail itself; adding it again here
          # crashes trufflehog with "flag 'fail' cannot be repeated" before
          # it scans anything -- a config bug, not a finding, that made
          # this job silently fail on every run since Phase 0/1.
          extra_args: --results=verified,unknown

  patterns:
    name: Angel One / config pattern check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on credential-shaped strings in tracked files
        run: |
          set -euo pipefail
          # Patterns tuned for this project. Extend as needed.
          # The quote is MANDATORY (not `["\']?`) -- a real hardcoded
          # secret in Python or YAML overwhelmingly appears as a quoted
          # string literal ("AKIA...", 'ghp_...'); an unquoted match is
          # almost always a bare variable reference (e.g.
          # `self._api_key = api_key`, a constructor storing its own
          # parameter) -- exactly the false-positive class that made this
          # check silently fail on every run since Phase 0/1, with nothing
          # actually leaked.
          PATTERNS='(api_?key|apikey|client_?code|client_?id|mpin|totp_?secret|totp_?seed|password|passwd|secret_?key|access_?token|refresh_?token|jwt_?token|feed_?token)[[:space:]]*[:=][[:space:]]*["'\''][A-Za-z0-9._-]{6,}'
          # Exclude documentation, examples, tests (deliberately fake
          # credential-shaped fixtures, e.g. testing bundle_check.py's OWN
          # separate credential scanner, live in tests/test_bundle_check.py)
          # and this workflow itself.
          if git grep -n -I -E "$PATTERNS" -- \
              ':!*.md' ':!*example*' ':!*sample*' ':!*template*' ':!tests/*' \
              ':!.github/workflows/secret-scan.yml' ':!.gitleaks.toml'; then
            echo "::error::Credential-shaped string found in a tracked file."
            exit 1
          fi
          echo "No credential-shaped strings in tracked files."

      - name: Ensure secrets files are not tracked
        run: |
          set -euo pipefail
          FOUND=0
          for f in secrets.yaml secrets.yml .env credentials.json config/secrets.yaml; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is tracked by git and must not be."
              FOUND=1
            fi
          done
          exit $FOUND

  bundle:
    name: Published bundle contains no credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan published data bundle and frontend build output
        run: |
          set -euo pipefail
          # The bundle is world-readable. Nothing credential-shaped may appear in it.
          TARGETS=""
          [ -d site/data ] && TARGETS="$TARGETS site/data"
          [ -d frontend/dist ] && TARGETS="$TARGETS frontend/dist"
          if [ -z "$TARGETS" ]; then
            echo "No built artifacts present in this checkout; skipping."
            exit 0
          fi
          if grep -rniE '(api_?key|client_?code|mpin|totp|feed_?token|jwt)' $TARGETS; then
            echo "::error::Credential-shaped string found in a published artifact."
            exit 1
          fi
          echo "Published artifacts are clean."
