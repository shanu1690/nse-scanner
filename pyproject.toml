[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-scanner"
version = "0.1.0"
description = "NSE delivery + F&O options scanner (Angel One SmartAPI backed)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "PyYAML>=6.0",
    "tabulate>=0.9",
    "smartapi-python>=1.5.5",
    "pyotp>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
nse-scan = "nse.cli:main"

[tool.setuptools.packages.find]
include = ["nse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
